name: Publish DocC reference

# Auto-publishes a versioned DocC HTML site to GitHub Pages on every
# semver tag push. Customers get an autoupdating API reference at
# https://san-techie21.github.io/foctta-ios-sdk/
#
# Closes gate G9 in the FOCTTA Mobile SDK production-readiness
# checklist.

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docc:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build DocC archive
        run: |
          set -euxo pipefail
          xcrun --toolchain swift swift package resolve
          xcrun --toolchain swift swift package \
            --allow-writing-to-directory ./docs-build \
            generate-documentation \
            --target FOCTTA \
            --output-path ./docs-build \
            --transform-for-static-hosting \
            --hosting-base-path foctta-ios-sdk \
            --disable-indexing

      - name: Add landing redirect
        run: |
          set -euxo pipefail
          cat > ./docs-build/index.html <<'HTML'
          <!doctype html>
          <html><head>
          <meta charset="utf-8"/>
          <meta http-equiv="refresh" content="0; url=documentation/foctta/"/>
          <title>FOCTTA iOS SDK · API reference</title>
          </head><body>
          <p>Redirecting to <a href="documentation/foctta/">FOCTTA API reference</a>…</p>
          </body></html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-build

  deploy:
    needs: build-docc
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
